name: MaltaShop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Order Service dependencies
        run: python -m pip install --upgrade pip && pip install -r order-service/requirements.txt

      - name: Install Notification Service dependencies
        run: pip install -r notification-service/requirements.txt

      - name: Compile Python source files
        run: python -m py_compile order-service/main.py notification-service/main.py
